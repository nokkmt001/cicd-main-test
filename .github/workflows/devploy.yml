name: GitHub Action Docker

on:
  push:
    branches: [ main-docker-android ]
  pull_request:
    branches: [ main-docker-android ]

jobs:
  build:
    runs-on: ubuntu-22.04 # Works also with self hosted runner supporting docker
    container:
      image: docker://fabernovel/android:api-35-ndk-v1.9.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruby Setup
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Ruby - Bundler
        uses: actions/cache@v3.4.3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Cache Gradle
        uses: actions/cache@v3.4.3
        with:
          path: ~/.gradle/caches/
          key: cache-clean-gradle-${{ matrix.os }}-${{ matrix.jdk }}

      - name: Cache Gradle Wrapper
        uses: actions/cache@v3.4.3
        with:
          path: ~/.gradle/wrapper/
          key: cache-clean-wrapper-${{ matrix.os }}-${{ matrix.jdk }}

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew
      - name: Install bundle
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build Test
        run: bundle exec fastlane tests

      - name: Fastlane
        run: bundle exec fastlane build_release