plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.firebase.appdistribution'
    id 'kotlin-kapt'
}

android {
    namespace 'com.phat.mytestcicd'
    compileSdk 34

    signingConfigs {
        pilot {
            keyAlias 'keyBTP'
            keyPassword 'nokkmt00113'
            storeFile file('./keyBTP')
            storePassword 'nokkmt00113'
        }
    }

    defaultConfig {
        applicationId "com.phat.mytestcicd"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        file(rootProject.file('key.properties')).with { propFile ->
            if (propFile.canRead()) {
                signingConfig signingConfigs.config
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            firebaseAppDistribution {
                appId = "1:616552094274:android:9d7b9cdb4b70a00b2febdb"
                artifactType="APK"
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'

    implementation platform('com.google.firebase:firebase-bom:31.1.1')

    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Dependency injection
    implementation 'io.insert-koin:koin-android:3.5.0'
    implementation 'io.insert-koin:koin-core:4.0.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    // Permission request helper
    implementation 'com.karumi:dexter:6.2.3'

    implementation 'androidx.browser:browser:1.8.0'

    // api
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.3"

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'

    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

}